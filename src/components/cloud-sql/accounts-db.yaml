kind: ConfigMap
metadata:
  name: accounts-db-config
data:
  POSTGRES_DB: accounts-db
  ACCOUNTS_DB_NAME: accounts-db
  ACCOUNTS_DB_HOST: accounts-db.cluster-xyz.us-east-1.rds.amazonaws.com
  ACCOUNTS_DB_PORT: "5432"
  ACCOUNTS_DB_USER: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: rds-db-config
type: Opaque
stringData:
  ACCOUNTS_DB_PASSWORD: replace-me
