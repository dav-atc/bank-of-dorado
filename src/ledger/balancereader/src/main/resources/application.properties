server.port = ${PORT}
handlers = java.util.logging.ConsoleHandler
spring.main.banner-mode=off
# OpenTelemetry tracing configuration
management.tracing.enabled=${ENABLE_TRACING}
management.tracing.sampling.probability=1.0
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
otel.propagators=tracecontext,baggage
#enables all tomcat metrics to be recorded
server.tomcat.mbeanregistry.enabled=true
#enables jpa metrics to be recorded
spring.jpa.properties.hibernate.generate_statistics=true
#set the jpa database platform
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
