apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-config
data:
  LOCAL_ROUTING_NUM: "883745000"
  PUB_KEY_PATH: "/tmp/.ssh/publickey"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-api-config
data:
  TRANSACTIONS_API_ADDR: "ledgerwriter:8080"
  BALANCES_API_ADDR: "balancereader:8080"
  HISTORY_API_ADDR: "transactionhistory:8080"
  CONTACTS_API_ADDR: "contacts:8080"
  USERSERVICE_API_ADDR: "userservice:8080"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: accounts-db-config
data:
  ACCOUNTS_DB_NAME: accounts-db
  ACCOUNTS_DB_HOST: accounts-db.cluster-xyz.us-east-1.rds.amazonaws.com
  ACCOUNTS_DB_PORT: "5432"
  ACCOUNTS_DB_USER: admin
---
apiVersion: v1
kind: Secret
metadata:
  name: rds-db-config
type: Opaque
stringData:
  ACCOUNTS_DB_PASSWORD: replace-me
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: demo-data-config
data:
  USE_DEMO_DATA: "True"
  DEMO_LOGIN_USERNAME: "testuser"
  # All demo user accounts are hardcoded to use the login password 'bankofanthos'
  DEMO_LOGIN_PASSWORD: "bankofanthos"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/bank-of-anthos-userservice
  name: bank-of-anthos
